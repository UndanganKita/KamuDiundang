    <style>
        /* Styles shortened for brevity */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #ff9a9e 0%, #fad0c4 100%);
            margin: 0;
            padding: 20px;
            color: #fff;

        h1 {

        h3 {

            font-size: 30px;

        .form-container {
            max-width: 500px;

            background: rgba(255, 255, 255, 0.3);
            border-radius: 15px;

        label {
            display: block;

            margin: 10px 0 5px;

        }

        input,
        textarea {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: inset 1px 1px 5px rgba(0, 0, 0, 0.2);
        }

        button {
            margin-top: 10px;
            padding: 12px 25px;
            background: linear-gradient(to right, #ff512f, #dd2476);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #422f2f6e;
            text-shadow: 3px 3px 5px rgba(216, 88, 228, 0.568);
        }

<body>
    <h3>Wedding</br>Edy & Cindy</h3>
    <h1>Bagikan Undangan Kamu</h1>

    <div class="form-container">
        <form id="editForm">
            <label for="kepada">nama tujuan</label>
            <textarea id="kepada" placeholder="exmp: Ibu/Bpk Edy"></textarea>

            <label for="dari">Nama Pengantin Laki</label>
            <input type="text" id="dari" placeholder="exmp: Edy & Cindy">

           
            
            <button type="submit">Buat link</button>
        </form>
        <div class="notification" id="notification"></div>
    </div>

    <div class="data-container" id="dataContainer">
        <h3 style="text-align: center;">Daftar Sudah Diundang</h3>
    </div>

    <footer>
        <p>Dibuat oleh Edy | Cindy</p>
    </footer>

    <script>
        document.getElementById('editForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Ambil nilai input
            const kepada = encodeURIComponent(document.getElementById('kepada').value);
            const dari = encodeURIComponent(document.getElementById('dari').value);
           
            
             // Ambil URL untuk gambar
    

            // Buat link dengan parameter
            const link = `https://undangankita.github.io/KamuDiundang/Data/?` +
                `kepada=${kepada}&dari=${dari}`;
               
            // Tampilkan notifikasi
            Swal.fire({
                icon: 'success',
                title: 'Berhasil!',
                html: `Salin tautan di bawah ini:<br><a href="${link}" target="_blank">${link}</a>`,
                confirmButtonColor: '#36d1dc',
            });
        });
    </script>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxx7BpocDQZ6WzU1c74E6VQx5bByE2k9SqgXM4dsNBtmW0jpc_BorZ0NO4xFZK_-APbjA/exec'; // Ganti dengan URL Apps Script Anda

        document.getElementById('editForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const tujuan = document.getElementById('kepada').value;
            const namaLaki = document.getElementById('dari').value;
            const waktu = new Date().toLocaleString();

            const formData = new FormData();
            formData.append('Nama_Tujuan', tujuan);
            formData.append('Pengantin_Laki', namaLaki);
            formData.append('Waktu', waktu);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    showNotification('Data berhasil disimpan!');
                    loadData();
                })
                .catch(error => {
                    showNotification('Terjadi kesalahan. Coba lagi.', true);
                });
        });
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.background = isError ? '#f2dede' : '#dff0d8';
            notification.style.color = isError ? '#a94442' : '#3c763d';
            notification.style.borderColor = isError ? '#ebccd1' : '#d6e9c6';
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        function loadData() {
            fetch(`${scriptURL}?action=read`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('dataContainer');
                    container.innerHTML = '<h3 style="text-align: center;">Daftar Sudah Diundang</h3>';
                    data.forEach(item => {
                        const p = document.createElement('p');
                        p.textContent = `${item.Waktu}: To: ${item.Nama_Tujuan} dari ${item.Pengantin_Laki}`;
                        container.appendChild(p);
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        // Load data saat halaman dibuka
        window.onload = loadData;

    </script>
